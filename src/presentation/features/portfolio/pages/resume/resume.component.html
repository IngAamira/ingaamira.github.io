<div class="max-w-5xl mx-auto px-4 py-8 text-center">

  <!-- 🔹 Actions -->
  <div class="flex flex-wrap justify-center gap-2 pb-6">

    <button
      *ngFor="let item of menuItemsResume()"
      class="flex items-center gap-2 border border-blue-500 text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 transition"
      (click)="item.event()"
    >
      📄 {{ item.name | translate }}
    </button>

  </div>

  <!-- 🔹 Accordion -->
  <div class="space-y-3 text-left">

    <div
      *ngFor="let group of accordionGroups"
      class="bg-white rounded-xl shadow-sm border overflow-hidden"
    >

      <!-- Header -->
      <button
        class="w-full flex justify-between items-center px-4 py-3 bg-blue-600 text-white"
        (click)="toggle(group.isOpen)"
      >
        <span class="truncate font-medium">
          {{ group.title | translate }}
        </span>

        <span class="text-lg">
          {{ isOpenState[group.isOpen] ? '−' : '+' }}
        </span>
      </button>

      <!-- Content -->
      <div *ngIf="isOpenState[group.isOpen]" class="p-4 border-t">

        <ng-container *ngComponentOutlet="group.component"></ng-container>

      </div>

    </div>

  </div>

</div>
