<section class="min-h-screen w-full p-10">

    <h1 class="mb-4 text-7xl tracking-tight font-extrabold md-text-9xl text-accent">404</h1>
    <p class="mb-4 text-3xl tracking-tight font-bold text-slate-100 md-text-4xl">Something's missing.</p>
    <p class="mb-4 text-lg font-light text-slate-400">Sorry, we can't find that page. You'll find lots to explore on the home page.</p>
    <a [routerLink]="homeLink" class="inline-flex bg-accent text-ink-950 font-semibold rounded-lg text-sm px-5 py-2-5 my-4 hover:bg-accent-soft focus:outline-none focus:ring-4 focus:ring-accent/40 transition">
      Back to Homepage
