<div class="bg-ink-900 rounded-2xl shadow-xl shadow-black/40 ring-1 ring-slate-800 max-w-2xl w-full overflow-hidden">
  <!-- Header -->
  <div class="flex justify-between items-center border-b p-4">
    <h2 class="text-xl font-bold">
      {{ project.name }}
    </h2>

    <button class="text-slate-400 hover:text-slate-200" (click)="close.emit()" aria-label="Close project details">
      ✕
    </button>
  </div>

  <!-- Body -->
  <div class="p-4 space-y-4">
    @if (project.pictures.length > 0) {
      <div class="flex flex-col items-center">
        <img
          [src]="selectedImage || project.pictures[0] || ''"
          class="w-80 h-80 object-contain rounded-xl ring-1 ring-slate-800 bg-ink-800"
          alt="project image"
          />
          <div class="flex gap-2 mt-3 flex-wrap justify-center">
            @for (pic of project.pictures; track pic) {
              <img
                [src]="pic"
                class="w-16 h-16 object-cover rounded bg-ink-800 cursor-pointer opacity-70 hover:opacity-100 transition"
                [class]="selectedImage === pic ? 'ring-2 ring-accent' : 'ring-1 ring-slate-700'"
                (click)="selectedImage = pic"
                />
            }
          </div>
        </div>
      }

      <hr />

      <!-- Description -->
      <div>
        <h3 class="font-semibold text-lg mb-2">Description:</h3>

        @for (text of project.summary; track text) {
          <p>
            {{ text }}
          </p>
        }
      </div>

      <!-- Link -->
      <div>
        <p>
          You can find this project on Github/Website
          <a
            [href]="project.projectLink"
            target="_blank"
            rel="noopener noreferrer"
            class="text-accent hover:underline ml-1"
            >
            🌐
          </a>
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-slate-800 p-4 flex flex-wrap justify-center gap-2">
      @for (tag of project.tags; track tag) {
        <span
          class="text-xs px-2.5 py-1 rounded-full"
          [class]="getTagColor(tag)"
          >
          {{ tag }}
        </span>
      }
    </div>
  </div>
