<div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full overflow-hidden">
  <!-- Header -->
  <div class="flex justify-between items-center border-b p-4">
    <h2 class="text-xl font-bold">
      {{ project.name }}
    </h2>

    <button class="text-gray-500 hover:text-gray-700" (click)="close.emit()">
      ✕
    </button>
  </div>

  <!-- Body -->
  <div class="p-4 space-y-4">
    <div *ngIf="project.pictures.length > 0" class="flex flex-col items-center">
      <img
        [src]="selectedImage || project.pictures[0] || ''"
        class="w-80 h-80 object-contain rounded-lg"
        alt="project image"
      />

      <div class="flex gap-2 mt-3 flex-wrap justify-center">
        <img
          *ngFor="let pic of project.pictures"
          [src]="pic"
          class="w-16 h-16 object-cover rounded cursor-pointer opacity-70 hover:opacity-100 border"
          (click)="selectedImage = pic"
        />
      </div>
    </div>

    <hr />

    <!-- Description -->
    <div>
      <h3 class="font-semibold text-lg mb-2">Description:</h3>

      <p *ngFor="let text of project.summary">
        {{ text }}
      </p>
    </div>

    <!-- Link -->
    <div>
      <p>
        You can find this project on Github/Website
        <a
          [href]="project.projectLink"
          target="_blank"
          rel="noopener noreferrer"
          class="text-blue-600 hover:underline ml-1"
        >
          🌐
        </a>
      </p>
    </div>
  </div>

  <!-- Footer -->
  <div class="border-t p-4 flex flex-wrap justify-center gap-2">
    <span
      *ngFor="let tag of project.tags"
      class="text-xs px-2 py-1 rounded-full text-white"
      [style.background-color]="getTagColor(tag)"
    >
      {{ tag }}
    </span>
  </div>
</div>
