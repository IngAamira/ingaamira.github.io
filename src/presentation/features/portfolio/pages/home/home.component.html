<div class="container">

  <div class="row">

    <!-- About Me -->
    <div class="col-sm-6">
      <div class="card h-100">
        <div class="card-header text-center">
          <h2>{{ 'ABOUT_ME.TITLE' | translate }}</h2>
        </div>

        <div class="text-center mx-auto d-none d-md-block">
          <img
            src="assets/imgs/home/profile.jpg"
            alt="Profile picture"
            width="250"
            height="250"
            class="img-fluid rounded-circle mt-4">
        </div>

        <div class="card-body">
          <div class="card-text mt-3" style="text-align: justify;">

            <ng-container *ngIf="('ABOUT_ME.TEXT' | translate) as texts">
              <div *ngFor="let aboutMeText of texts">
                <p>{{ aboutMeText }}</p>
              </div>
            </ng-container>

            <div class="card-text mt-2" style="text-align: justify;">
              <p>
                {{ 'ABOUT_ME.SCHEDULE' | translate }}
                <a (click)="openContactPage()">
                  <i class="bi bi-calendar3"></i>
                </a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Featured Project -->
    <div class="col-sm-6 mx-auto d-none d-md-block">
      <div class="card h-100">
        <div class="card-header text-center">
          <h2>{{ 'FEATURED_PROJECT.TITLE' | translate }}</h2>
        </div>

        <div class="card-body">

          <carousel *ngIf="project" class="d-block carousel carousel-dark slide">
            <div *ngFor="let picture of project.pictures">
              <slide>
                <div class="text-center py-2">
                  <img
                    [src]="picture"
                    alt="Project introduction"
                    width="300"
                    height="300"
                    class="img-fluid">
                </div>
              </slide>
            </div>
          </carousel>

          <div class="card-title mt-5" *ngIf="project">
            <h5>{{ project.name }}</h5>
          </div>

          <div class="card-text mt-2" style="text-align: justify;">
            <p>{{ 'FEATURED_PROJECT.SUMMARY' | translate }}</p>
            <p>
              {{ 'FEATURED_PROJECT.INFO' | translate }}
              <a [routerLink]="'/portfolio'">
                <i class="bi bi-briefcase-fill"></i>
              </a>
            </p>
          </div>

        </div>
      </div>
    </div>

  </div>

</div>
