<header
  class="relative text-center text-white m-3 px-4 py-10 bg-gradient-to-b from-teal-500 via-purple-600 to-indigo-700 rounded-xl"
>
  <!-- Titles -->
  <div class="flex flex-col items-center gap-2">
    <ng-container *ngFor="let item of itemsTitle; let isFirst = first">
      <h1 *ngIf="isFirst" class="text-2xl md:text-4xl font-bold">
        {{ item.title | translate }}
      </h1>
      <h3 *ngIf="!isFirst" class="text-sm md:text-xl text-center max-w-2xl">
        {{ item.title | translate }}
      </h3>
    </ng-container>
  </div>

  <!-- Language selector -->
  <div class="absolute bottom-3 right-3 flex gap-2">
    <button
      *ngFor="let item of menuItemsHeader"
      (click)="item.event()"
      class="p-1 rounded-full hover:scale-110 transition"
      [attr.aria-label]="item.flag"
      [title]="item.flag"
    >
      <img
        [src]="item.img"
        [alt]="item.flag"
        class="w-8 h-8 rounded-full object-cover"
      />
    </button>
  </div>
</header>
