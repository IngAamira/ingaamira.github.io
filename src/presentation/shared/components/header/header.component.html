<header
  class="relative text-center m-3 px-4 py-10 bg-gradient-to-b from-accent-dim/30 via-ink-900 to-ink-950 border border-slate-800 rounded-xl shadow-lg"
  >
  <!-- Titles -->
  <div class="flex flex-col items-center gap-2">
    @for (item of itemsTitle; track item; let isFirst = $first) {
      @if (isFirst) {
        <h1 class="text-2xl md:text-4xl font-bold">
          {{ item.title | translate }}
        </h1>
      }
      @if (!isFirst) {
        <h3 class="text-sm md:text-xl text-center max-w-2xl">
          {{ item.title | translate }}
        </h3>
      }
    }
  </div>

  <!-- Language selector -->
  <div class="absolute bottom-3 right-3 flex gap-2">
    @for (item of menuItemsHeader; track item) {
      <button
        (click)="item.event()"
        class="p-1 rounded-full hover:scale-110 transition"
        [attr.aria-label]="item.flag"
        [title]="item.flag"
        >
        <img
          [src]="item.img"
          [alt]="item.flag"
          class="w-8 h-8 rounded-full object-cover"
          />
        </button>
      }
    </div>
  </header>
