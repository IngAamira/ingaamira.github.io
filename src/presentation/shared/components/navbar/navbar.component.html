<hr class="my-4 border-gray-200">

<nav class="flex justify-center">

  <a
    *ngFor="let item of menuItemsHome"
    [routerLink]="item.route"
    routerLinkActive="bg-purple-600 text-white font-semibold"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex flex-col items-center justify-center mx-2 px-4 py-2 rounded-xl text-purple-700 hover:bg-purple-100 transition text-2xl md:text-base"
  >

    <!-- Icon -->
    <i [class]="item.img"></i>

    <!-- Label -->
    <span class="hidden md:block mt-1 text-sm">
      {{ item.name | translate }}
    </span>

  </a>

</nav>

<hr class="my-4 border-gray-200">
