<hr class="my-4 border-slate-800" />

<nav class="flex justify-center">
  <div class="flex gap-2 md:gap-6">
    @for (item of menuItemsHome; track trackByRoute($index, item)) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-accent-soft font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex flex-col items-center justify-center px-3 py-2 rounded-xl text-slate-400 hover:text-accent-soft transition"
        >
        <svg
          class="w-8 h-8 md:w-6 md:h-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
          >
          <path
            [attr.d]="item.icon"
            stroke-linecap="round"
            stroke-linejoin="round"
            />
          </svg>
          <span class="mt-1 text-[10px] md:text-sm">
            {{ item.name | translate }}
          </span>
        </a>
      }
    </div>
  </nav>

  <hr class="my-4 border-slate-800" />
